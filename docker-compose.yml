services:
  postgres:
    image: postgis/postgis:18-3.6-alpine
    platform: linux/amd64
    container_name: ts-mapped-postgres
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "postgres"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5444:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  redis:
    image: redis:7
    container_name: ts-mapped-redis
    ports:
      - "6380:6379"

  mailpit:
    image: axllent/mailpit
    container_name: ts-mapped-mailpit
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI port
    volumes:
      - mailpit_data:/data

  # Optional local MinIO, for testing file storage. Not started by default:
  #   docker compose --profile minio up -d
  # MinIO no longer publishes images, so this uses Chainguard's build, as
  # production does (set MINIO_IMAGE to use another). Both services use it:
  # the image includes the mc client.
  # The root credentials come from LOCAL_MINIO_ROOT_USER and
  # LOCAL_MINIO_ROOT_PASSWORD in .env. Generate random values: never reuse
  # the production MinIO keys here.
  minio:
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}
    container_name: ts-mapped-minio
    profiles: ["minio"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${LOCAL_MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${LOCAL_MINIO_ROOT_PASSWORD:-}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Creates the buckets to match production: ts-mapped is publicly readable,
  # the private bucket is not
  minio-init:
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}
    profiles: ["minio"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      ROOT_USER: ${LOCAL_MINIO_ROOT_USER:-}
      ROOT_PASSWORD: ${LOCAL_MINIO_ROOT_PASSWORD:-}
      PRIVATE_BUCKET: ${MINIO_PRIVATE_BUCKET:-ts-mapped-private}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$ROOT_USER $$ROOT_PASSWORD &&
      mc mb --ignore-existing local/ts-mapped &&
      mc anonymous set download local/ts-mapped &&
      mc mb --ignore-existing local/$$PRIVATE_BUCKET &&
      mc anonymous set none local/$$PRIVATE_BUCKET
      "

volumes:
  pgdata:
  mailpit_data:
  minio_data:
